# NAT VPS: provider hanya meneruskan port publik tertentu ke port internal.
# Contoh: HTTP publik 33335 -> internal 33335, HTTPS publik 33336 -> internal 33336.
# Ganti wapala.example.org dan pasangan port di bawah sesuai panel provider.
# Zone rate-limit (context http; file ini di-include di http).
limit_req_zone $binary_remote_addr zone=wapala_auth:2m rate=30r/m;
limit_req_zone $binary_remote_addr zone=wapala_public:2m rate=120r/m;

# --- Cloudflare CDN (opsional): pulihkan IP klien asli -----------------
# Saat domain di-proxy lewat Cloudflare, $remote_addr di origin = IP edge
# Cloudflare; tanpa blok ini semua pengunjung berbagi satu bucket throttle
# (app memercayai X-Forwarded-For yang kita kirim). Modul realip hanya
# memercayai rentang resmi Cloudflare — aman bila CF tidak dipakai.
# Daftar resmi: https://www.cloudflare.com/ips/
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
# Catatan Cloudflare: SSL/TLS Full (strict); JANGAN Cache Everything untuk
# HTML/auth/API (CSP nonce per respons); aset /_next/static ter-cache otomatis.

server {
    listen 33335;
    server_name wapala.example.org;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host:33336$request_uri; }
}
server {
    listen 33336 ssl http2;
    server_name wapala.example.org;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/wapala.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wapala.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Batas app buku 50 MB; 60m memberi ruang overhead multipart.
    client_max_body_size 60m;
    location /api/auth/ {
        limit_req zone=wapala_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
    location /api/public/ {
        limit_req zone=wapala_public burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
}
