# NAT VPS: provider hanya meneruskan port publik tertentu ke port internal.
# Contoh: HTTP publik 33335 -> internal 33335, HTTPS publik 33336 -> internal 33336.
# Ganti wapala.example.org dan pasangan port di bawah sesuai panel provider.
# Zone rate-limit (context http; file ini di-include di http).
limit_req_zone $binary_remote_addr zone=wapala_auth:2m rate=30r/m;
limit_req_zone $binary_remote_addr zone=wapala_public:2m rate=120r/m;
server {
    listen 33335;
    server_name wapala.example.org;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host:33336$request_uri; }
}
server {
    listen 33336 ssl http2;
    server_name wapala.example.org;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/wapala.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wapala.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Batas app buku 50 MB; 60m memberi ruang overhead multipart.
    client_max_body_size 60m;
    location /api/auth/ {
        limit_req zone=wapala_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
    location /api/public/ {
        limit_req zone=wapala_public burst=30 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
}
