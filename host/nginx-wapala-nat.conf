# NAT VPS: provider hanya meneruskan port publik tertentu ke port internal.
# Contoh WAPALA lama: HTTP publik 33335 -> internal 33335, HTTPS publik 33336 -> internal 33336.
# Ganti wapala.example.org dan pasangan port di bawah sesuai panel provider.
# Terbitkan sertifikat dulu (README bagian DNS/NAT) sebelum blok 443 diaktifkan.
server {
    listen 33335;
    server_name wapala.example.org;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host:33336$request_uri; }
}
server {
    listen 33336 ssl;
    server_name wapala.example.org;
    ssl_certificate /etc/letsencrypt/live/wapala.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wapala.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 75s;
    }
}
